name: Presentation exercise suite

# Called once per presentation folder discovered in exercise-tests.yml.
# Exercises come from the folders. Practice and solutions are steps on the same check.
on:
  workflow_call:
    inputs:
      presentation_dir:
        description: Presentation folder at the repository root
        required: true
        type: string
      presentation_job_title:
        description: Title shown for this presentation
        required: true
        type: string

run-name: ${{ inputs.presentation_job_title }}

permissions:
  contents: read
  actions: write

jobs:
  discover_exercises:
    name: Discover exercises
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover exercises in this presentation
        id: set_matrix
        env:
          CI_DISCOVER_SCOPE: presentation
          CI_PRESENTATION_DIR: ${{ inputs.presentation_dir }}
        run: bash scripts/ci-discover-matrix.sh

  test_exercises:
    name: ${{ matrix.job_title }}
    needs: discover_exercises
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover_exercises.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download dependency bundle
        uses: actions/download-artifact@v8
        with:
          name: ci-node-modules
          path: downloaded/

      - name: Extract dependencies
        run: tar -xzf downloaded/node_modules.tgz

      - name: Restore cached practice result
        id: practice_cache
        uses: actions/cache@v5
        with:
          path: reports/practice.ndjson
          key: html-practice-${{ matrix.key }}-${{ hashFiles(format('{0}/**', matrix.exercise_dir), 'lib/**', 'jest.config.js', 'package-lock.json') }}

      - name: Restore cached solution result
        id: solution_cache
        uses: actions/cache@v5
        with:
          path: reports/solutions.ndjson
          key: html-solutions-${{ matrix.key }}-${{ hashFiles(matrix.test_file, format('{0}/**', matrix.solution_dir), 'lib/**', 'jest.config.js', 'package-lock.json') }}

      - name: Practice
        id: practice
        if: steps.practice_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          CI_MODE: practice
          CI_RESULT_NDJSON: ${{ github.workspace }}/reports/practice.ndjson
          CI_EXERCISE_DIR: ${{ matrix.exercise_dir }}
          CI_TEST_FILE: ${{ matrix.test_file }}
          CI_PRESENTATION_NUMBER: ${{ matrix.presentation_number }}
          CI_PRESENTATION_TITLE: ${{ matrix.presentation_title }}
          CI_CHAPTER_NUMBER: ${{ matrix.chapter_number }}
          CI_CHAPTER_TITLE: ${{ matrix.chapter_title }}
          CI_EXERCISE_NUMBER: ${{ matrix.exercise_number }}
          CI_EXERCISE_SLUG: ${{ matrix.exercise_slug }}
          PROGRESS_STUDENT_ID: ${{ github.actor }}
        run: node scripts/ci-run-exercise.js

      - name: Practice (cached)
        id: practice_cached
        if: steps.practice_cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          CI_FROM_CACHE: "1"
          CI_RESULT_NDJSON: ${{ github.workspace }}/reports/practice.ndjson
        run: node scripts/ci-run-exercise.js

      - name: Solutions
        id: solutions
        if: steps.solution_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          CI_MODE: solutions
          CI_RESULT_NDJSON: ${{ github.workspace }}/reports/solutions.ndjson
          CI_EXERCISE_DIR: ${{ matrix.exercise_dir }}
          CI_TEST_FILE: ${{ matrix.test_file }}
          CI_PRESENTATION_NUMBER: ${{ matrix.presentation_number }}
          CI_PRESENTATION_TITLE: ${{ matrix.presentation_title }}
          CI_CHAPTER_NUMBER: ${{ matrix.chapter_number }}
          CI_CHAPTER_TITLE: ${{ matrix.chapter_title }}
          CI_EXERCISE_NUMBER: ${{ matrix.exercise_number }}
          CI_EXERCISE_SLUG: ${{ matrix.exercise_slug }}
          PROGRESS_STUDENT_ID: ${{ github.actor }}
        run: node scripts/ci-run-exercise.js

      - name: Solutions (cached)
        id: solutions_cached
        if: steps.solution_cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          CI_FROM_CACHE: "1"
          CI_RESULT_NDJSON: ${{ github.workspace }}/reports/solutions.ndjson
        run: node scripts/ci-run-exercise.js

      - name: Stage result shards
        if: always()
        run: |
          mkdir -p reports/ci-shards
          cp reports/practice.ndjson "reports/ci-shards/${{ matrix.key }}--practice.ndjson"
          cp reports/solutions.ndjson "reports/ci-shards/${{ matrix.key }}--solutions.ndjson"

      - name: Upload result shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-ndjson-${{ matrix.key }}
          path: reports/ci-shards/
          if-no-files-found: ignore

      - name: Propagate test failure
        if: >-
          steps.practice.outcome == 'failure' ||
          steps.practice_cached.outcome == 'failure' ||
          steps.solutions.outcome == 'failure' ||
          steps.solutions_cached.outcome == 'failure'
        run: exit 1
