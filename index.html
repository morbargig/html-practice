    <section id="forms">
    <h2>Forms</h2>
    <form action="/submit" method="post">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required>
        <br>


        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>
        <br>


        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" pattern="[0-9]{10}">
        <br>

        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="0" max="120">
        <br>

        <label for="birthday">Birthday</label>
        <input id="birthday" name="birthday" type="date" min="1900-01-01" max="2026-10-15">
        <br>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
        <br>

        <button type="submit">Send Message</button>
    </form>
