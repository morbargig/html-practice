<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
</head>
<body>
    <h1>Student Dashboard</h1>
    <p>
        <label for="course-completion">Course completion:</label>
        <progress id="course-completion" max="100">70%</progress>
    </p>
    <p>
        <label for="academic-performance">Academic performance:</label>
        <meter id="academic-performance" min="0" max="100"></meter>
    </p>

         Add a paragraph that uses the words progress and meter and explains the difference. -->
</body>
</html>
